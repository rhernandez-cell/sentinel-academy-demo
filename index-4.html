<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef3f8;font-family:Inter,Arial,sans-serif;line-height:1.6}
header{height:76px;background:#07121f;border-bottom:1px solid #26384e;display:flex;align-items:center;padding:10px 22px;position:sticky;top:0;z-index:20}
.logo{height:52px;max-width:290px;object-fit:contain}.brand{margin-left:auto;color:#879aae;font-size:12px;letter-spacing:.08em}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 76px)}aside{background:#081321;border-right:1px solid #1d3046;padding:18px;overflow:auto;position:sticky;top:76px;height:calc(100vh - 76px)}
.small{font-size:11px;color:#d6b64f;font-weight:900;letter-spacing:.16em}.nav{width:100%;text-align:left;border:0;background:transparent;color:#aab9c9;padding:8px 10px;border-radius:8px;cursor:pointer}
.nav.module{font-weight:800;color:#f0f4f8;margin-top:7px}.nav.lesson{font-size:12px;padding-left:22px}.nav.active{background:#14263a;color:#fff;border-left:3px solid #d6b64f}.nav.done{color:#6cdbab}
main{max-width:950px;width:100%;margin:auto;padding:38px 28px}.hero{padding:26px;border:1px solid #26384e;border-radius:20px;background:linear-gradient(135deg,#081522,#0d1c2c)}
h1{font-size:40px;line-height:1.1;margin:9px 0}h2{font-size:23px;margin:8px 0}h3{font-size:17px}.muted{color:#9aacbe}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.card{background:#0b1726;border:1px solid #26384e;border-radius:16px;padding:21px}.card.click{cursor:pointer}.card.click:hover{border-color:#a4863c}
.progress{height:8px;background:#17293d;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#d6b64f}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{border:1px solid #3a4d65;border-radius:999px;padding:5px 9px;font-size:12px;color:#c5d1dc}
.lesson-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.badge{color:#d6b64f;font-size:11px;font-weight:900;letter-spacing:.13em}
.box{margin-top:18px;background:#0b1726;border:1px solid #26384e;border-radius:16px;padding:23px}.activity{border-left:3px solid #d6b64f;background:#07111d;padding:15px;margin-top:18px}
.error{border-left:3px solid #9aa6b5;background:#0a1421;padding:15px;margin-top:14px;color:#bdc8d2}
.ai{border:1px solid #3a4d65;background:#0a1624;border-radius:12px;padding:15px;margin-top:14px;color:#cbd7e2}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}button.cta{border:1px solid #425873;background:#102137;color:white;border-radius:10px;padding:12px 16px;cursor:pointer}button.primary{background:#b9963e;border-color:#b9963e;color:#07111d;font-weight:900}
.final{margin-top:20px;border:1px solid #8c7438;background:#111d2b;border-radius:18px;padding:23px}
footer{padding:30px;text-align:center;color:#667b92;font-size:12px}
@media(max-width:780px){header{padding:10px 14px}.brand{display:none}.layout{display:block}aside{display:none}main{padding:20px 14px}h1{font-size:31px}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><img class="logo" src="sentinel-logo.png" alt="SENTINEL Academy"><div class="brand">IA APLICADA AL ANÁLISIS DE INTELIGENCIA · V2</div></header>

<script>
const modules=[{"id": 1, "name": "PENSAR", "lessons": [{"title": "1.1 Datos, información e inteligencia", "content": "Distingue dato, información, análisis e inteligencia y relaciona cada nivel con una necesidad de decisión.", "activity": "Clasifica diez afirmaciones y justifica por qué son hechos, inferencias o hipótesis.", "error": "No confundas una respuesta fluida con inteligencia: la inteligencia responde a una necesidad concreta.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "1.2 Necesidad de inteligencia", "content": "Convierte peticiones vagas en preguntas operativas definiendo decisor, decisión, horizonte, ámbito y criterio de éxito.", "activity": "Transforma tres peticiones genéricas en necesidades de inteligencia.", "error": "No empieces a buscar antes de saber qué pregunta debes responder.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "1.3 Ciclo de inteligencia", "content": "Aplica orientación, obtención, procesamiento, análisis, producción, difusión y retroalimentación como proceso iterativo.", "activity": "Construye el ciclo de un caso ficticio y registra qué decisión depende de cada fase.", "error": "Recopilar información no equivale a analizarla.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "1.4 Hechos, inferencias e hipótesis", "content": "Separa lo observado de lo interpretado y de las explicaciones que todavía deben contrastarse.", "activity": "Reescribe un párrafo confuso manteniendo la trazabilidad.", "error": "Nunca presentes una hipótesis como un hecho.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "1.5 Sesgos y pensamiento estructurado", "content": "Reconoce confirmación, anclaje, disponibilidad y exceso de confianza; utiliza hipótesis competidoras y revisión adversarial.", "activity": "Intenta refutar una conclusión propia con una explicación alternativa.", "error": "No busques únicamente evidencia que confirme tu primera impresión.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "1.6 Incertidumbre y confianza", "content": "Expresa conclusiones proporcionales a la evidencia y explica qué podría elevar o reducir la confianza.", "activity": "Redacta valoraciones con confianza baja, moderada y alta, justificándolas.", "error": "Evita porcentajes precisos cuando la evidencia no permite esa precisión.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}]}, {"id": 2, "name": "INVESTIGAR", "lessons": [{"title": "2.1 Diseñar una investigación", "content": "Define objetivo, alcance, fecha de corte, entidades, preguntas, criterios de éxito y registro de evidencias.", "activity": "Crea un plan OSINT reproducible de una página.", "error": "No acumules enlaces sin criterio de parada.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "2.2 Arquitectura de búsqueda", "content": "Construye búsquedas progresivas usando términos, nombres, frases exactas, dominios, fechas, idiomas y relaciones.", "activity": "Documenta diez consultas y qué incertidumbre reduce cada una.", "error": "No dependas de una única consulta.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "2.3 Evaluar una fuente", "content": "Valora autoridad, proximidad al hecho, actualidad, interés, independencia, consistencia y trazabilidad.", "activity": "Evalúa cinco fuentes y separa calidad de la fuente y calidad de la afirmación.", "error": "Popularidad no significa fiabilidad.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "2.4 Corroboración e independencia", "content": "Distingue corroboración real de repetición y compara origen, fecha, atribución, cifras y discrepancias.", "activity": "Construye una cadena de corroboración.", "error": "Varias páginas pueden repetir la misma fuente original.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "2.5 Cronologías y actores", "content": "Ordena acontecimientos y vincula actores solo cuando exista evidencia, separando relaciones observadas e inferidas.", "activity": "Construye una cronología y un mapa básico de actores.", "error": "Proximidad temporal no demuestra causalidad.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "2.6 Información engañosa y verificación", "content": "Detecta contexto perdido, atribuciones débiles, material reutilizado y afirmaciones sin respaldo suficiente.", "activity": "Clasifica afirmaciones como confirmadas, parcialmente confirmadas, no confirmadas o refutadas, justificándolo.", "error": "No confirmado no significa automáticamente falso.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}]}, {"id": 3, "name": "POTENCIAR", "lessons": [{"title": "3.1 Modelo mental de la IA", "content": "Comprende la IA generativa como herramienta de apoyo: rápida para transformar material, pero capaz de producir errores.", "activity": "Divide una investigación en tareas donde la IA ayuda y tareas que requieren validación humana.", "error": "Una respuesta convincente no es una fuente.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "3.2 Extracción estructurada", "content": "Extrae entidades, fechas, afirmaciones y relaciones conservando el origen y marcando dudas.", "activity": "Convierte un documento ficticio en una tabla de evidencias.", "error": "Revisa siempre el documento original.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "3.3 Comparación de documentos", "content": "Usa IA para detectar coincidencias, cambios y contradicciones entre versiones.", "activity": "Compara dos documentos y verifica cada diferencia relevante.", "error": "Una diferencia textual no siempre es una diferencia analítica.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "3.4 IA para hipótesis", "content": "Genera explicaciones alternativas y preguntas de investigación sin convertir posibilidades en hechos.", "activity": "Construye una matriz con hipótesis, evidencias a favor, en contra y observaciones discriminantes.", "error": "No pidas a la IA que decida quién es responsable.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "3.5 Prompt Maestro SENTINEL", "content": "Construye prompts con objetivo, contexto, corpus, límites, criterios de calidad, formato, incertidumbre y revisión.", "activity": "Transforma un prompt genérico en un Prompt Maestro.", "error": "Un prompt vago produce resultados difíciles de auditar.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "3.6 Revisión adversarial", "content": "Utiliza IA para buscar hechos sin fuente, contradicciones, saltos inferenciales y exceso de certeza.", "activity": "Audita un brief defectuoso y corrígelo.", "error": "No uses la misma salida como única comprobación.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "3.7 Flujo SENTINEL de IA", "content": "Integra preparar corpus, extraer, comparar, generar alternativas, analizar, redactar, auditar y verificar.", "activity": "Ejecuta un mini-flujo completo y registra dónde intervino la IA.", "error": "La IA acelera tareas; el analista conserva el criterio.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}]}, {"id": 4, "name": "ANALIZAR", "lessons": [{"title": "4.1 Análisis de actores", "content": "Identifica intereses, capacidades, dependencias, incentivos y restricciones sin atribuir intenciones por asociación.", "activity": "Construye una matriz de actores con evidencia y confianza.", "error": "Una relación comercial no demuestra coordinación.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "4.2 Hipótesis competidoras", "content": "Compara explicaciones alternativas mediante evidencias a favor, en contra y neutrales.", "activity": "Actualiza una matriz de hipótesis tras recibir nueva evidencia.", "error": "No crees hipótesis alternativas artificialmente débiles.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "4.3 Valoración y confianza", "content": "Redacta conclusiones calibradas y explica su respaldo, lagunas y condiciones de cambio.", "activity": "Convierte conclusiones absolutas en valoraciones defendibles.", "error": "Confianza no equivale a probabilidad matemática.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "4.4 Riesgo", "content": "Define evento, probabilidad cualitativa, impacto, horizonte, indicadores y mitigaciones.", "activity": "Crea una matriz de riesgos priorizada.", "error": "Evita falsa precisión numérica.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "4.5 Indicadores y alertas", "content": "Diseña señales observables que aumenten o reduzcan la confianza en una hipótesis o riesgo.", "activity": "Define cinco indicadores y qué cambio activaría una revisión.", "error": "Un indicador debe tener relación razonable con la hipótesis.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "4.6 Escenarios", "content": "Construye escenarios base, alternativo y adverso y define señales tempranas para cada uno.", "activity": "Redacta tres escenarios y sus indicadores.", "error": "Un escenario no es una predicción inevitable.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}]}, {"id": 5, "name": "INFORMAR", "lessons": [{"title": "5.1 Escribir para decidir", "content": "Responde primero a la necesidad del destinatario; el análisis debe apoyar la valoración.", "activity": "Reduce dos páginas de análisis a un párrafo útil para un decisor.", "error": "No escondas la conclusión detrás de metodología.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "5.2 Arquitectura del Brief", "content": "Integra resumen ejecutivo, valoración, hechos, análisis, hipótesis, riesgos, indicadores, recomendaciones, confianza y fuentes.", "activity": "Ordena un brief desestructurado.", "error": "No mezcles hechos y recomendaciones sin transición.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "5.3 Lenguaje calibrado", "content": "Diferencia expresiones como se observa, es consistente con, sugiere y se estima.", "activity": "Edita diez frases para hacerlas proporcionales a la evidencia.", "error": "Evita dramatización y absolutos.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "5.4 Visualización y trazabilidad", "content": "Usa tablas, cronologías y esquemas solo cuando reduzcan carga cognitiva y conserva su origen.", "activity": "Decide qué debe presentarse como texto, tabla o cronología.", "error": "No diseñes para decorar; diseña para comprender.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "5.5 Brief defectuoso vs SENTINEL", "content": "Detecta fuentes ausentes, inferencias, contradicciones, exceso de certeza y recomendaciones débiles.", "activity": "Corrige un brief defectuoso y explica cinco cambios.", "error": "Mejorar estilo no arregla un razonamiento deficiente.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "5.6 Control final", "content": "Audita pregunta, fechas, nombres, cifras, fuentes, inferencias, contradicciones, confianza y recomendaciones.", "activity": "Aplica la checklist final antes de entregar.", "error": "Revisar ortografía no es revisar el análisis.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}]}, {"id": 6, "name": "DECIDIR", "lessons": [{"title": "6.1 Briefing de misión", "content": "NOVA Systems, empresa ficticia, detecta cambios simultáneos en proveedores, dirección, actividad comercial y presencia digital.", "activity": "Formula necesidad de inteligencia y tres preguntas prioritarias.", "error": "No saltes directamente a una explicación.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "6.2 Expediente y evidencia", "content": "Trabaja con un expediente ficticio de 15 piezas con señales, ruido y contradicciones.", "activity": "Crea el registro de evidencias y evalúa cada pieza.", "error": "No todas las piezas tienen el mismo valor probatorio.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "6.3 Investigación", "content": "Construye consultas, registra fuentes y completa cronología y actores usando el corpus autorizado.", "activity": "Entrega registro OSINT y mapa de actores.", "error": "No introduzcas hechos externos como si fueran parte del expediente.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "6.4 Análisis", "content": "Formula al menos tres hipótesis, identifica contradicciones y construye matriz de riesgos e indicadores.", "activity": "Entrega hipótesis, riesgos, indicadores y confianza.", "error": "No elijas hipótesis demasiado pronto.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "6.5 Producto", "content": "Redacta un Intelligence Brief de una página más anexo de trazabilidad.", "activity": "Entrega producto final con fuentes, confianza y limitaciones.", "error": "Un informe largo que no responde al decisor no es un buen producto.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}, {"title": "6.6 Evaluación y reevaluación", "content": "Defiende la valoración y actualízala ante nueva evidencia. Rúbrica: problema 15%, fuentes 20%, análisis 25%, riesgos 15%, producto 15%, rigor 10%. Umbral recomendado 70/100. RECURSOS Y EVALUACIÓN Ficha de necesidad de inteligencia Registro OSINT Ficha de evaluación de fuentes Matriz de actores Matriz de hipótesis Matriz de evidencia Matriz de riesgos Plantilla de indicadores y alertas Prompt Maestro SENTINEL Checklist de verificación de IA Plantilla Intelligence Brief Checklist final de control de calidad Hoja de evaluación Operación SENTINEL Banco y proyecto final El banco de evaluación se ampliará a 40–60 preguntas para permitir selección aleatoria. El proyecto final será Operación SENTINEL — Horizonte Norte. El certificado indicará expresamente que es privado y no constituye titulación oficial ni homologación pública. Pendientes para V3 técnica Convertir las 37 lecciones en tarjetas navegables. Crear los 13 recursos editables. Implementar tests por módulo y examen aleatorio. Construir el expediente ficticio completo de Horizonte Norte. Automatizar registro de progreso y finalización. Generar certificado con identificador único y QR. Revisar textos de venta, checkout y condiciones antes del lanzamiento.", "activity": "Registra qué cambió tras la actualización y por qué.", "error": "Mantener la conclusión inicial por coherencia narrativa es un error.", "ia": "pedir a la IA que estructure, contraste o audite el material suministrado, sin inventar hechos y manteniendo trazabilidad."}]}];
const lessons=modules.flatMap(m=>m.lessons.map((l,i)=>({...l,module:m.id,moduleName:m.name,number:i+1})));
let current=localStorage.getItem('sentinel_v2_current')||'home';
let done=JSON.parse(localStorage.getItem('sentinel_v2_done')||'[]');
function save(){localStorage.setItem('sentinel_v2_current',current);localStorage.setItem('sentinel_v2_done',JSON.stringify(done))}
function go(x){current=x;save();render();scrollTo(0,0)}
function pct(){return Math.round(done.length/lessons.length*100)}
function renderSide(){
let s='<div class="small">PROGRAMA · 37 LECCIONES</div><button class="nav module" onclick="go(\'home\')">⌂ Dashboard</button>';
modules.forEach(m=>{s+=`<button class="nav module" onclick="go('M${m.id}')">M${m.id} · ${m.name}</button>`;
m.lessons.forEach((l,i)=>{let id=`m${m.id}l${i+1}`;s+=`<button class="nav lesson ${current===id?'active ':''}${done.includes(id)?'done':''}" onclick="go('${id}')">${done.includes(id)?'✓ ':''}${l.title}</button>`})});document.getElementById('side').innerHTML=s}
function home(){document.getElementById('main').innerHTML=`
<div class="hero"><div class="small">SENTINEL ACADEMY · V2</div><h1>IA aplicada al Análisis de Inteligencia</h1>
<p class="muted">Recorrido completo: pensar, investigar, potenciar con IA, analizar, informar y decidir.</p>
<div class="tags"><span class="tag">37 lecciones</span><span class="tag">30–40 h estimadas</span><span class="tag">OSINT</span><span class="tag">IA</span><span class="tag">Intelligence Brief</span><span class="tag">Operación SENTINEL</span></div></div>
<div class="card" style="margin-top:18px"><b>Progreso del curso · ${pct()}%</b><div class="progress"><div class="bar" style="width:${pct()}%"></div></div><span class="muted">${done.length} / ${lessons.length} lecciones completadas</span></div>
<div class="grid">${modules.map(m=>`<div class="card click" onclick="go('M${m.id}')"><div class="small">MÓDULO ${m.id}</div><h2>${m.name}</h2><p class="muted">${m.lessons.length} lecciones</p></div>`).join('')}</div>
<div class="final"><b style="color:#dfc15a">Objetivo final</b><p>Aplicar el método completo en Operación SENTINEL — Horizonte Norte y producir un Intelligence Brief trazable y defendible.</p></div>`}
function mod(n){let m=modules.find(x=>x.id===n);document.getElementById('main').innerHTML=`<div class="small">MÓDULO ${m.id}</div><h1>${m.name}</h1><p class="muted">Selecciona una lección. Cada lección combina concepto, aplicación, actividad y revisión.</p><div class="grid">${m.lessons.map((l,i)=>{let id=`m${m.id}l${i+1}`;return `<div class="card click" onclick="go('${id}')"><div class="small">${done.includes(id)?'✓ COMPLETADA':'LECCIÓN '+(i+1)}</div><h2>${l.title.replace(/^\d+\.\d+\s+/,'')}</h2><p class="muted">${l.content.slice(0,150)}…</p></div>`}).join('')}</div>`}
function lesson(id){let i=lessons.findIndex(x=>`m${x.module}l${x.number}`===id),l=lessons[i],prev=lessons[i-1],next=lessons[i+1];
document.getElementById('main').innerHTML=`<div class="lesson-top"><div><div class="small">MÓDULO ${l.module} · LECCIÓN ${l.number}</div><h1>${l.title}</h1><p class="muted">${l.moduleName}</p></div><div class="badge">${done.includes(id)?'COMPLETADA':'EN CURSO'}</div></div>
<div class="box"><h3>Concepto</h3><p>${l.content}</p>
<div class="ai"><b>🤖 IA SENTINEL</b><p>${l.ia||'Utiliza la IA para estructurar, contrastar o auditar el material suministrado, sin inventar hechos y manteniendo trazabilidad.'}</p></div>
<div class="activity"><b>Actividad práctica</b><p>${l.activity}</p></div>
