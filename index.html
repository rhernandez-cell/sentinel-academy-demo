<style>

*{box-sizing:border-box}body{margin:0;background:#050b14;color:#eef3f8;font-family:Inter,Arial,sans-serif;line-height:1.6}

header{height:76px;background:#07121f;border-bottom:1px solid #26384e;display:flex;align-items:center;padding:10px 22px;position:sticky;top:0;z-index:20}

.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 76px)}aside{background:#081321;border-right:1px solid #1d3046;padding:18px;overflow:auto;position:sticky;top:76px;height:calc(100vh - 76px)}

.progress{height:8px;background:#17293d;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#d6b64f}

.error{border-left:3px solid #9aa6b5;background:#0a1421;padding:15px;margin-top:14px;color:#bdc8d2}.ai{border:1px solid #3a4d65;background:#0a1624;border-radius:12px;padding:15px;margin-top:14px;color:#cbd7e2}

.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}button.cta{border:1px solid #425873;background:#102137;color:white;border-radius:10px;padding:12px 16px;cursor:pointer}button.primary{background:#b9963e;border-color:#b9963e;color:#07111d;font-weight:900}

.account{margin-left:18px;display:flex;gap:8px;align-items:center}.account button{border:1px solid #425873;background:#102137;color:white;border-radius:9px;padding:8px 11px;cursor:pointer}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}

.authbox{width:min(430px,100%);background:#0b1726;border:1px solid #3a4d65;border-radius:18px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.45)}

.authbox input{width:100%;margin:7px 0;padding:12px;border-radius:9px;border:1px solid #425873;background:#07111d;color:#fff}.authbox .row{display:flex;gap:10px;margin-top:12px}.authbox .row button{flex:1}.authmsg{font-size:13px;color:#cbd7e2;margin-top:12px}

@media(max-width:780px){header{padding:10px 14px}.brand{display:none}.layout{display:block}aside{display:none}main{padding:20px 14px}h1{font-size:31px}.grid{grid-template-columns:1fr}.account{margin-left:auto}}

a."},{"title":"2.2 Arquitectura de búsqueda","content":"Construye búsquedas progresivas con términos, frases exactas, dominios, fechas e idiomas.","activity":"Documenta diez consultas y qué incertidumbre reduce cada una.","error":"No dependas de una única consulta."},{"title":"2.3 Evaluar una fuente","content":"Valora autoridad, proximidad, actualidad, interés, independencia, consistencia y trazabilidad.","activity":"Evalúa cinco fuentes y separa calidad de fuente y afirmación.","error":"Popularidad no significa fiabilidad."},{"title":"2.4 Corroboración e independencia","content":"Distingue corroboración real de repetición y compara origen, fecha y atribución.","activity":"Construye una cadena de corroboración.","error":"Varias páginas pueden repetir la misma fuente original."},{"title":"2.5 Cronologías y actores","content":"Ordena acontecimientos y vincula actores solo cuando exista evidencia.","activity":"Construye una cronología y un mapa básico de actores.","error":"Proximidad temporal no demuestra causalidad."},{"title":"2.6 Información engañosa y verificación","content":"Detecta contexto perdido, atribuciones débiles, material reutilizado y afirmaciones sin respaldo.","activity":"Clasifica afirmaciones como confirmadas, parcialmente confirmadas, no confirmadas o refutadas.","error":"No confirmado no significa automáticamente falso."}]},{"id":3,"name":"POTENCIAR","lessons":[{"title":"3.1 Modelo mental de la IA","content":"Comprende la IA generativa como herramienta de apoyo rápida pero capaz de producir errores.","activity":"Divide una investigación en tareas donde la IA ayuda y tareas que requieren validación.","error":"Una respuesta convincente no es una fuente."},{"title":"3.2 Extracción estructurada","content":"Extrae entidades, fechas, afirmaciones y relaciones conservando el origen.","activity":"Convierte un documento ficticio en una tabla de evidencias.","error":"Revisa siempre el documento original."},{"title":"3.3 Comparación de documentos","content":"Usa IA para detectar coincidencias, cambios y contradicciones entre versiones.","activity":"Compara dos documentos y verifica cada diferencia relevante.","error":"Una diferencia textual no siempre es una diferencia analítica."},{"title":"3.4 IA para hipótesis","content":"Genera explicaciones alternativas sin convertir posibilidades en hechos.","activity":"Construye una matriz de hipótesis y evidencias.","error":"No pidas a la IA que decida responsabilidades."},{"title":"3.5 Prompt Maestro SENTINEL","content":"Construye prompts con objetivo, contexto, corpus, límites, criterios, formato y revisión.","activity":"Transforma un prompt genérico en un Prompt Maestro.","error":"Un prompt vago produce resultados difíciles de auditar."},{"title":"3.6 Revisión adversarial","content":"Utiliza IA para buscar hechos sin fuente, contradicciones y saltos inferenciales.","activity":"Audita un brief defectuoso y corrígelo.","error":"No uses la misma salida como única comprobación."},{"title":"3.7 Flujo SENTINEL de IA","content":"Integra preparar corpus, extraer, comparar, generar alternativas, analizar, redactar, auditar y verificar.","activity":"Ejecuta un mini-flujo completo y registra dónde intervino la IA.","error":"La IA acelera tareas; el analista conserva el criterio."}]},{"id":4,"name":"ANALIZAR","lessons":[{"title":"4.1 Análisis de actores","content":"Identifica intereses, capacidades, dependencias, incentivos y restricciones sin atribuir intenciones por asociación.","activity":"Construye una matriz de actores con evidencia y confianza.","error":"Una relación comercial no demuestra coordinación."},{"title":"4.2 Hipótesis competidoras","content":"Compara explicaciones alternativas mediante evidencias a favor, en contra y neutrales.","activity":"Actualiza una matriz de hipótesis tras nueva evidencia.","error":"No crees hipótesis alternativas artificialmente débiles."},{"title":"4.3 Valoración y confianza","content":"Redacta conclusiones calibradas y explica respaldo, lagunas y condiciones de cambio.","activity":"Convierte conclusiones absolutas en valoraciones defendibles.","error":"Confianza no equivale a probabilidad matemática."},{"title":"4.4 Riesgo","content":"Define evento, probabilidad cualitativa, impacto, horizonte, indicadores y mitigaciones.","activity":"Crea una matriz de riesgos priorizada.","error":"Evita falsa precisión numérica."},{"title":"4.5 Indicadores y alertas","content":"Diseña señales observables que aumenten o reduzcan la confianza en una hipótesis o riesgo.","activity":"Define cinco indicadores y qué cambio activaría una revisión.","error":"Un indicador debe tener relación razonable con la hipótesis."},{"title":"4.6 Escenarios","content":"Construye escenarios base, alternativo y adverso y define señales tempranas.","activity":"Redacta tres escenarios y sus indicadores.","error":"Un escenario no es una predicción inevitable."}]},{"id":5,"name":"INFORMAR","lessons":[{"title":"5.1 Escribir para decidir","content":"Responde primero a la necesidad del destinatario; el análisis debe apoyar la valoración.","activity":"Reduce dos páginas de análisis a un párrafo útil para un decisor.","error":"No escondas la conclusión detrás de metodología."},{"title":"5.2 Arquitectura del Brief","content":"Integra resumen ejecutivo, valoración, hechos, análisis, hipótesis, riesgos, indicadores, recomendaciones, confianza y fuentes.","activity":"Ordena un brief desestructurado.","error":"No mezcles hechos y recomendaciones sin transición."},{"title":"5.3 Lenguaje calibrado","content":"Diferencia expresiones como se observa, es consistente con, sugiere y se estima.","activity":"Edita diez frases para hacerlas proporcionales a la evidencia.","error":"Evita dramatización y absolutos."},{"title":"5.4 Visualización y trazabilidad","content":"Usa tablas, cronologías y esquemas cuando reduzcan carga cognitiva y conserva su origen.","activity":"Decide qué debe presentarse como texto, tabla o cronología.","error":"No diseñes para decorar; diseña para comprender."},{"title":"5.5 Brief defectuoso vs SENTINEL","content":"Detecta fuentes ausentes, inferencias, contradicciones, exceso de certeza y recomendaciones débiles.","activity":"Corrige un brief defectuoso y explica cinco cambios.","error":"Mejorar estilo no arregla un razonamiento deficiente."},{"title":"5.6 Control final","content":"Audita pregunta, fechas, nombres, cifras, fuentes, inferencias, contradicciones, confianza y recomendaciones.","activity":"Aplica la checklist final antes de entregar.","error":"Revisar ortografía no es revisar el análisis."}]},{"id":6,"name":"DECIDIR","lessons":[{"title":"6.1 Briefing de misión","content":"NOVA Systems, empresa ficticia, detecta cambios simultáneos en proveedores, dirección, actividad comercial y presencia digital.","activity":"Formula necesidad de inteligencia y tres preguntas prioritarias.","error":"No saltes directamente a una explicación."},{"title":"6.2 Expediente y evidencia","content":"Trabaja con un expediente ficticio de 15 piezas con señales, ruido y contradicciones.","activity":"Crea el registro de evidencias y evalúa cada pieza.","error":"No todas las piezas tienen el mismo valor probatorio."},{"title":"6.3 Investigación","content":"Construye consultas, registra fuentes y completa cronología y actores usando el corpus autorizado.","activity":"Entrega registro OSINT y mapa de actores.","error":"No introduzcas hechos externos como si fueran parte del expediente."},{"title":"6.4 Análisis","content":"Formula al menos tres hipótesis, identifica contradicciones y construye matriz de riesgos e indicadores.","activity":"Entrega hipótesis, riesgos, indicadores y confianza.","error":"No elijas hipótesis demasiado pronto."},{"title":"6.5 Producto","content":"Redacta un Intelligence Brief de una página más anexo de trazabilidad.","activity":"Entrega producto final con fuentes, confianza y limitaciones.","error":"Un informe largo que no responde al decisor no es un buen producto."},{"title":"6.6 Evaluación y reevaluación","content":"Defiende la valoración y actualízala ante nueva evidencia. Rúbrica: problema 15%, fuentes 20%, análisis 25%, riesgos 15%, producto 15%, rigor 10%. Umbral recomendado 70/100. El certificado es privado y no constituye titulación oficial ni homologación pública.","activity":"Registra qué cambió tras la actualización y por qué.","error":"Mantener la conclusión inicial por coherencia narrativa es un error."}]}];const lessons=modules.flatMap(m=>m.lessons.map((l,i)=>({...l,module:m.id,moduleName:m.name,number:i+1})));

const lessons=modules.flatMap(m=>m.lessons.map((l,i)=>({...l,module:m.id,moduleName:m.name,number:i+1})));

let current=localStorage.getItem("sentinel_v3_current")||"home",currentUser=null,done=[];

function loadLocalDone(){try{done=JSON.parse(localStorage.getItem(currentUser?"sentinel_v3_done_"+currentUser.id:"sentinel_v3_done_guest")||"[]")}catch(e){done=[]}}

function save(){localStorage.setItem("sentinel_v3_current",current);localStorage.setItem(currentUser?"sentinel_v3_done_"+currentUser.id:"sentinel_v3_done_guest",JSON.stringify(done))}

function pct(){return lessons.length?Math.round(done.length/lessons.length*100):0}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function go(x){current=x;save();render();scrollTo(0,0)}

function renderAccount(){

const e=document.getElementById("account");

if(currentUser)e.innerHTML="<span class='muted'>"+esc(currentUser.email||"Alumno")+"</span><button onclick='logout()'>Salir</button>";

else e.innerHTML="<button onclick='openAuth(\"login\")'>Iniciar sesión</button>";

}

function renderSide(){

let s="<div class='small'>PROGRAMA · 37 LECCIONES</div><button class='nav module' onclick=\"go('home')\">⌂ Dashboard</button>";

modules.forEach(m=>{s+="<button class='nav module' onclick=\"go('M"+m.id+"')\">M"+m.id+" · "+esc(m.name)+"</button>";

m.lessons.forEach((l,i)=>{let id="m"+m.id+"l"+(i+1);s+="<button class='nav lesson "+(current===id?"active ":"")+(done.includes(id)?"done":"")+"' onclick=\"go('"+id+"')\">"+(done.includes(id)?"✓ ":"")+esc(l.title)+"</button>"})});

document.getElementById("side").innerHTML=s}

function home(){document.getElementById("main").innerHTML="<div class='hero'><div class='small'>SENTINEL ACADEMY · V3</div><h1>IA aplicada al Análisis de Inteligencia</h1><p class='muted'>Recorrido completo: pensar, investigar, potenciar con IA, analizar, informar y decidir.</p><div class='tags'><span class='tag'>37 lecciones</span><span class='tag'>30–40 h estimadas</span><span class='tag'>OSINT</span><span class='tag'>IA</span><span class='tag'>Intelligence Brief</span><span class='tag'>Operación SENTINEL</span></div></div><div class='card' style='margin-top:18px'><b>Progreso del curso · "+pct()+"%</b><div class='progress'><div class='bar' style='width:"+pct()+"%'></div></div><span class='muted'>"+done.length+" / "+lessons.length+" lecciones completadas</span></div><div class='grid'>"+modules.map(m=>"<div class='card click' onclick=\"go('M"+m.id+"')\"><div class='small'>MÓDULO "+m.id+"</div><h2>"+esc(m.name)+"</h2><p class='muted'>"+m.lessons.length+" lecciones</p></div>").join("")+"</div><div class='final'><b style='color:#dfc15a'>Objetivo final</b><p>Aplicar el método completo en Operación SENTINEL — Horizonte Norte y producir un Intelligence Brief trazable y defendible.</p></div>"}

function mod(n){let m=modules.find(x=>x.id===n);if(!m){go("home");return}document.getElementById("main").innerHTML="<div class='small'>MÓDULO "+m.id+"</div><h1>"+esc(m.name)+"</h1><p class='muted'>Selecciona una lección. Cada lección combina concepto, aplicación, actividad y revisión.</p><div class='grid'>"+m.lessons.map((l,i)=>{let id="m"+m.id+"l"+(i+1);return "<div class='card click' onclick=\"go('"+id+"')\"><div class='small'>"+(done.includes(id)?"✓ COMPLETADA":"LECCIÓN "+(i+1))+"</div><h2>"+esc(l.title.replace(/^\d+\.\d+\s+/,""))+"</h2><p class='muted'>"+esc(l.content.slice(0,150))+"…</p></div>"}).join("")+"</div>"}

function lesson(id){let i=lessons.findIndex(x=>"m"+x.module+"l"+x.number===id);if(i<0){go("home");return}let l=lessons[i],prev=lessons[i-1],next=lessons[i+1];document.getElementById("main").innerHTML="<div class='lesson-top'><div><div class='small'>MÓDULO "+l.module+" · LECCIÓN "+l.number+"</div><h1>"+esc(l.title)+"</h1><p class='muted'>"+esc(l.moduleName)+"</p></div><div class='badge'>"+(done.includes(id)?"COMPLETADA":"EN CURSO")+"</div></div><div class='box'><h3>Concepto</h3><p>"+esc(l.content)+"</p><div class='ai'><b>🤖 IA SENTINEL</b><p>"+esc(l.ia||"Utiliza la IA para estructurar, contrastar o auditar el material suministrado, sin inventar hechos y manteniendo trazabilidad.")+"</p></div><div class='activity'><b>Actividad práctica</b><p>"+esc(l.activity)+"</p></div><div class='error'><b>Error a evitar</b><p>"+esc(l.error)+"</p></div></div><div class='actions'><button class='cta' onclick=\"go('"+(prev?"m"+prev.module+"l"+prev.number:"home")+"\")\">← Anterior</button><button class='cta primary' onclick='complete()'>"+(done.includes(id)?(next?"Siguiente →":"Volver al inicio"):"Marcar completada ✓")+"</button></div>"}

function complete(){if(!currentUser){openAuth("login");document.getElementById("authMsg").textContent="Inicia sesión para guardar el progreso asociado a tu cuenta.";return}let i=lessons.findIndex(x=>"m"+x.module+"l"+x.number===current);if(!done.includes(current))done.push(current);current=lessons[i+1]?"m"+lessons[i+1].module+"l"+lessons[i+1].number:"home";save();render();scrollTo(0,0)}

let authMode="login";

function openAuth(mode){authMode=mode||"login";document.getElementById("authTitle").textContent=authMode==="login"?"Iniciar sesión":"Crear cuenta";document.getElementById("authMsg").textContent="";document.getElementById("authModal").classList.add("show")}

function closeAuth(){document.getElementById("authModal").classList.remove("show")}

function switchAuth(){openAuth(authMode==="login"?"signup":"login")}

async function submitAuth(){const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value,msg=document.getElementById("authMsg");msg.textContent="Procesando…";try{let r=authMode==="login"?await supabaseClient.auth.signInWithPassword({email,password}):await supabaseClient.auth.signUp({email,password});if(r.error)throw r.error;currentUser=r.data.user||null;loadLocalDone();render();if(currentUser){msg.textContent=authMode==="signup"?"Cuenta creada. Si se solicita confirmación, revisa tu email.":"Sesión iniciada correctamente.";setTimeout(closeAuth,900)}else msg.textContent="Revisa tu email para confirmar la cuenta."}catch(e){msg.textContent=e.message||"No se pudo completar la operación."}}

async function logout(){await supabaseClient.auth.signOut();currentUser=null;done=[];render()}

async function initAuth(){const r=await supabaseClient.auth.getSession();currentUser=r.data.session?.user||null;loadLocalDone();render();supabaseClient.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;loadLocalDone();render()})}

function render(){renderAccount();renderSide();if(current==="home")home();else if(current[0]==="M")mod(Number(current.slice(1)));else lesson(current)}

initAuth();

</script>
